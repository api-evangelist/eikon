aid: eikon
name: Eikon
description: 'Eikon Therapeutics is a biopharmaceutical company that integrates Nobel
  Prize-winning super-resolution single-molecule tracking (SMT) microscopy, advanced
  engineering, automation, and high-performance computing to visualize and measure
  the real-time movement of individual proteins in living cells. This proprietary live-cell
  imaging platform screens protein-ligand interactions across millions of cells per
  day, generating large, high-dimensional datasets that power the discovery and development
  of novel small-molecule medicines. Eikon advances a clinical- and preclinical-stage
  oncology and immunology pipeline, including EIK1001 (a TLR7/8 agonist) and IMP1734
  (a selective PARP1 inhibitor). Backed by General Catalyst, the company is headquartered
  in Millbrae, California with offices in New York and Jersey City.'
